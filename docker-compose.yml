version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatsked
      POSTGRES_PASSWORD: chatsked_dev_pw
      POSTGRES_DB: chatsked
    ports:
      - "5432:5432"
    volumes:
      - chatsked_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  chatsked_pg_data: